apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-status
automountServiceAccountToken: {{ .Values.clusterRead.enabled }}
{{- if .Values.clusterRead.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-status-applications
  namespace: {{ .Values.clusterRead.applicationNamespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-status-applications
  namespace: {{ .Values.clusterRead.applicationNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-status-applications
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-status
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-status-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-status-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-status-pods
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-status
    namespace: {{ .Release.Namespace }}
{{- end }}

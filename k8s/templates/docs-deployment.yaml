{{- if .Values.docs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-docs
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-docs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: docs
    app.kubernetes.io/part-of: platform-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-docs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-docs
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: docs
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docs
          image: "{{ .Values.images.docs.repository }}:{{ .Values.images.docs.tag }}"
          imagePullPolicy: {{ .Values.images.docs.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.docs.resources | nindent 12 }}
{{- end }}

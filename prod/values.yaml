# Per-install values. Keys here are THIS install's own facts, pinned
# explicitly: the app chart's defaults belong to whichever install it was
# authored against, and an omitted key inherits them silently.
# Sign-in goes through this install's platform-studio realm (granted in
# teams/platform-studio); the app's own Basic gate then covers /mcp alone.
platform-studio:
  host: platform-studio.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/platform-studio
      clientId: platform-studio
      existingSecret: keycloak-platform-studio
  config:
    STUDIO_DEPLOY_BRANCH: deploy-rb
  images:
    app:
      repository: ghcr.io/foundryrb/platform-studio-app
      tag: 1.0.0
    docs:
      repository: ghcr.io/foundryrb/platform-studio-docs
      tag: 1.0.0

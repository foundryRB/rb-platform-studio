platform-studio:
  host: platform-studio.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/platform-studio
      clientId: platform-studio
      existingSecret: keycloak-platform-studio
  config:
    STUDIO_DEPLOY_BRANCH: deploy-rb
  images:
    app:
      repository: ghcr.io/foundryrb/platform-studio-app
      tag: 1.0.1
    docs:
      repository: ghcr.io/foundryrb/platform-studio-docs
      tag: 1.0.1

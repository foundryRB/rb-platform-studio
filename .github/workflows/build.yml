# platform-studio CI: a thin caller of the platform's reusable build workflow.
# The build logic lives once in foundryRB/rb-ci; this only
# points at it, so it cannot drift. Runs on GitHub-hosted runners.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    uses: foundryRB/rb-ci/.github/workflows/build.yml@main
    with:
      app-name: platform-studio
      runner: ubuntu-latest
    permissions:
      contents: write
      packages: write
    secrets: inherit
